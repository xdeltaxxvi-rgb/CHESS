name: Task
description: A development task (feature, art, QA, etc.)
labels: ["type:feature"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options:
        - "Phase 1: Chess Engine Core"
        - "Phase 2: AI Opponent"
        - "Phase 3: 3D Art & Camera"
        - "Phase 4: Story & Narrative"
        - "Phase 5: UI/UX"
        - "Phase 6: Audio"
        - "Phase 7: Mobile Optimization"
        - "Phase 8: QA & Bug Fix"
        - "Phase 9: Monetization & Analytics"
        - "Phase 10: Launch Preparation"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 — Critical (blocks release)
        - P1 — High
        - P2 — Medium
        - P3 — Low
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done? Be specific.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How do we know this task is done?
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Estimated Hours
      placeholder: "4"

  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Issue numbers this task depends on (e.g. #12, #15)
