name: Bug Report
description: Report a bug or broken behaviour
labels: ["type:bug", "P0-critical"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Select a knight
        3. Move it to an invalid square — move is accepted
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device & OS
      placeholder: "Samsung Galaxy A52, Android 13"

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 — Crash / data loss / game-breaking
        - P1 — Major feature broken
        - P2 — Minor issue
        - P3 — Visual / cosmetic
